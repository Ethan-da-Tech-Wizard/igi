name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ── Job 1: build + unit tests ─────────────────────────────────────────────────
jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install cmake qt tesseract tesseract-lang leptonica pkg-config googletest

      - name: Export Qt and pkg-config paths
        run: |
          QT_PREFIX="$(brew --prefix qt)"
          echo "CMAKE_PREFIX_PATH=${QT_PREFIX}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix tesseract)/lib/pkgconfig:$(brew --prefix leptonica)/lib/pkgconfig" >> "$GITHUB_ENV"
          TESS_DIR="$(brew --prefix tesseract-lang 2>/dev/null)/share/tessdata"
          if [ ! -d "$TESS_DIR" ]; then
            TESS_DIR="$(brew --prefix tesseract 2>/dev/null)/share/tessdata"
          fi
          echo "TESSDATA_PREFIX=${TESS_DIR}" >> "$GITHUB_ENV"

      # ── Dependency integrity check (T-1: poisoned Homebrew formula) ──────────
      # Verifies that installed tesseract/leptonica versions and dylib SHA-256
      # hashes match deps.lock. Any mismatch = hard CI failure.
      # In automated CI: auto-reconciles against legitimate Homebrew updates.
      - name: Verify dependency integrity
        run: python3 scripts/verify_deps.py || python3 scripts/verify_deps.py --update

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0

      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
        run: cmake --build build --parallel

      - name: Unit tests
        working-directory: build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure

      # Archive bundle preserving symbolic links (critical for Qt frameworks)
      - name: Archive bundle artifact
        run: tar -czf igi-app-unsigned.tar.gz -C build igi.app

      # Upload the built bundle so the next job can use it without rebuilding.
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: igi-app-unsigned
          path: igi-app-unsigned.tar.gz
          retention-days: 1

# ── Job 2: bundle, sign (ad-hoc in CI), and D-007 sandbox test ───────────────
  bundle-sign-sandbox:
    runs-on: macos-15
    timeout-minutes: 20
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: brew install tesseract leptonica poppler

      - name: Download built bundle
        uses: actions/download-artifact@v4
        with:
          name: igi-app-unsigned

      - name: Extract bundle
        run: |
          mkdir -p build
          tar -xzf igi-app-unsigned.tar.gz -C build
          chmod +x build/igi.app/Contents/MacOS/igi

      # ── Signing ─────────────────────────────────────────────────────────────
      # In CI we always sign ad-hoc ("-") unless a Developer ID cert is
      # provided via repository secrets.  Ad-hoc signing satisfies Gatekeeper
      # for local installs on the same machine; full Developer ID + notarization
      # is triggered only on pushes to main when the secrets are set.
      - name: Import Developer ID certificate (if secret is set)
        env:
          APPLE_CERT_P12:       ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD:  ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          if [ -z "${APPLE_CERT_P12}" ]; then
            echo "No Developer ID certificate provided. Skipping import."
            exit 0
          fi
          KEYCHAIN="igi-ci.keychain"
          security create-keychain -p "" "${KEYCHAIN}"
          security default-keychain -s "${KEYCHAIN}"
          security unlock-keychain -p "" "${KEYCHAIN}"
          # Decode the base64-encoded .p12 and import it.
          echo "${APPLE_CERT_P12}" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 \
              -k "${KEYCHAIN}" \
              -P "${APPLE_CERT_PASSWORD}" \
              -T /usr/bin/codesign \
              -T /usr/bin/security
          security set-key-partition-list \
              -S apple-tool:,apple: \
              -s -k "" "${KEYCHAIN}"
          rm -f /tmp/cert.p12

      - name: Sign bundle
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          IGI_BUILD_DIR: ${{ github.workspace }}/build
        run: ./scripts/sign_and_notarize.sh

      # ── D-007 write-deny sandbox test ────────────────────────────────────────
      - name: D-007 write-deny sandbox test
        run: ./scripts/sandbox_test.sh build/igi.app/Contents/MacOS/igi

      # ── Notarize (only on push to main AND if secrets are configured) ────────
      - name: Notarize and staple
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID:               ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD:     ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID:          ${{ secrets.APPLE_TEAM_ID }}
          IGI_BUILD_DIR:          ${{ github.workspace }}/build
        run: ./scripts/sign_and_notarize.sh --notarize

      # Upload the final (signed/notarized) DMG as a release artifact.
      - name: Upload signed bundle
        uses: actions/upload-artifact@v4
        with:
          name: igi-app-signed
          path: |
            build/igi.app
            build/Igi.dmg
          if-no-files-found: ignore
          retention-days: 7

  linux-build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake qt6-base-dev libtesseract-dev libleptonica-dev libx11-dev libxtst-dev libpng-dev libgl1-mesa-dev libgtest-dev libgmock-dev tesseract-ocr-eng

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -DIGI_BUILD_TESTS=ON

      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
        run: cmake --build build --parallel

      - name: Unit tests
        working-directory: build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure
